
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои ссылки</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;

  /* Красивый градиентный фон */
  background:
    radial-gradient(circle at 15% 20%, #fbc2eb 0%, transparent 35%),
    radial-gradient(circle at 85% 25%, #a6c1ee 0%, transparent 35%),
    radial-gradient(circle at 50% 90%, #c2e9fb 0%, transparent 40%),
    linear-gradient(135deg, #e0c3fc, #d9e9ff, #fce4ec);

  background-attachment: fixed;
  font-family: Arial, sans-serif;
  color: #17243a;
}

/* Карточка */
main {
  width: 100%;
  max-width: 400px;
  padding: 35px 22px;
  border-radius: 26px;
  background: rgba(255, 255, 255, 0.92);
  text-align: center;
  box-shadow: 0 15px 50px rgba(49, 65, 120, 0.18);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.8);
}

h1 {
  font-size: 28px;
  color: #293c68;
  margin-top: 0;
}

p {
  color: #657087;
  line-height: 1.5;
  margin-bottom: 25px;
}

/* Кнопки */
a.button {
  display: block;
  margin-top: 18px;
  padding: 19px 12px;
  border-radius: 14px;
  color: white;
  text-decoration: none;
  font-size: 18px;
  font-weight: bold;
  transition: all 0.3s ease;
  box-shadow: 0 5px 15px rgba(0,0,0,0.10);
}

a.button:hover {
  transform: translateY(-4px);
  box-shadow: 0 9px 20px rgba(0,0,0,0.16);
}

.telegram {
  background: linear-gradient(135deg, #229ed9, #1476bd);
}

.disk {
  background: linear-gradient(135deg, #3975d7, #174ea6);
}

.contact {
  background: linear-gradient(135deg, #36bd91, #16845e);
  cursor: pointer;
}

/* Контактная информация */
#contactInfo {
  display: none;
  margin-top: 20px;
  padding: 18px 10px;
  border-radius: 14px;
  background: #edf8f3;
  line-height: 1.7;
  animation: appear 0.3s ease;
}

#contactInfo a {
  color: #174ea6;
  font-size: 21px;
  font-weight: bold;
  text-decoration: none;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(-8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

</style>
</head>

<body>

<main>

<h1>Добро пожаловать!</h1>

<p>Выберите, куда хотите перейти</p>

<a class="button telegram"
href="https://t.me/motorina_psuchology"
target="_blank">
✈️ Мой Telegram-канал
</a>

<a class="button disk"
href="https://disk.yandex.ru/client/disk?from=tableau_yabro"
target="_blank">
☁️ Мой Яндекс Диск
</a>

<a class="button contact" onclick="showContact()">
📞 Связаться со мной
</a>

<div id="contactInfo">
  <strong>Людмила Николаевна</strong><br>
  📞 <a href="tel:+79094585433">8 909 458 54 33</a>
</div>

</main>

<script>
function showContact() {
  const info = document.getElementById('contactInfo');

  info.style.display =
    info.style.display === 'block' ? 'none' : 'block';
}
</script>

</body>
</html>
