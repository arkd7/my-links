<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои ссылки</title>

<style>
body {
  margin: 0;
  padding: 24px;
  min-height: 100vh;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f1f5fb;
  font-family: Arial, sans-serif;
  color: #17243a;
}

main {
  width: 100%;
  max-width: 400px;
  box-sizing: border-box;
  padding: 30px 22px;
  border-radius: 24px;
  background: white;
  text-align: center;
  box-shadow: 0 8px 30px #17365d15;
}

h1 {
  font-size: 28px;
}

p {
  color: #657087;
  line-height: 1.5;
}

a {
  display: block;
  margin-top: 18px;
  padding: 19px 12px;
  border-radius: 14px;
  color: white;
  text-decoration: none;
  font-size: 18px;
  font-weight: bold;
  transition: opacity 0.2s;
}

a:hover {
  opacity: 0.85;
}

.telegram {
  background: #229ed9;
}

.disk {
  background: #174ea6;
}

.call {
  background: #20a464;
}
</style>
</head>

<body>
<main>
  <h1>Добро пожаловать!</h1>
  <p>Выберите, куда хотите перейти</p>

  <a class="telegram"
     href="https://t.me/motorina_psuchology"
     target="_blank"
     rel="noopener noreferrer">
    ✈️ Мой Telegram-канал
  </a>

  <a class="disk"
     href="https://disk.yandex.ru/client/disk?from=tableau_yabro"
     target="_blank"
     rel="noopener noreferrer">
    ☁️ Мой Яндекс Диск
  </a>

  <a class="call"
     href="https://images.meme-arsenal.com/550a6cbc24fe30f86071b5e52254588d.jpg"
     target="_blank"
     rel="noopener noreferrer">
    📞 Позвонить мне хуйня
  </a>
</main>
</body>
</html>
