
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои ссылки</title>
<style>
body {
  margin: 0;
  padding: 24px;
  min-height: 100vh;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f1f5fb;
  font-family: Arial, sans-serif;
  color: #17243a;
}
main {
  width: 100%;
  max-width: 400px;
  box-sizing: border-box;
  padding: 30px 22px;
  border-radius: 24px;
  background: white;
  text-align: center;
  box-shadow: 0 8px 30px #17365d15;
}
h1 { font-size: 28px; }
p { color: #657087; line-height: 1.5; }
a.button {
  display: block;
  margin-top: 18px;
  padding: 19px 12px;
  border-radius: 14px;
  color: white;
  text-decoration: none;
  font-size: 18px;
  font-weight: bold;
}
.telegram { background: #229ed9; }
.disk { background: #174ea6; }
.contact { background: #239b70; cursor: pointer; }

#contactInfo {
  display: none;
  margin-top: 20px;
  padding: 18px 10px;
  border-radius: 14px;
  background: #edf8f3;
  line-height: 1.7;
}
#contactInfo a {
  color: #174ea6;
  font-size: 21px;
  font-weight: bold;
  text-decoration: none;
}
</style>
</head>
<body>

<main>
<h1>Добро пожаловать!</h1>
<p>Выберите, куда хотите перейти</p>

<a class="button telegram"
href="https://t.me/motorina_psuchology">
✈️ Мой Telegram-канал
</a>

<a class="button disk"
href="https://disk.yandex.ru/client/disk?from=tableau_yabro">
☁️ Мой Яндекс Диск
</a>

<a class="button contact" onclick="showContact()">
📞 Связаться со мной
</a>

<div id="contactInfo">
  <strong>Людмила Николаевна</strong><br>
  📞 <a href="tel:+79094585433">8 909 458 54 33</a>
</div>

</main>

<script>
function showContact() {
  const info = document.getElementById('contactInfo');
  info.style.display =
    info.style.display === 'block' ? 'none' : 'block';
}
</script>

</body>
</html>
